version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mysql-network

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - mysql-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/student_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql-data:

networks:
  mysql-network:
    driver: bridge